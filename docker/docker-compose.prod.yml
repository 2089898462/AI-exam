version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: exam_system
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/exam_system
      DEBUG: "false"

  ai-service:
    build:
      context: ..
      dockerfile: docker/ai-service.Dockerfile
    restart: always
    ports:
      - "8001:8001"
    environment:
      DEBUG: "false"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data_prod: